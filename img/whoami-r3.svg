<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="whoami">
<style>
.fg{fill:#0b0d10} .mut{fill:#5b636e} .dim{fill:#9aa3ad} .acc{fill:#e5484d}
.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.ln{stroke:#d8dde3;stroke-width:1;fill:none} .lnf{stroke:#0b0d10;stroke-width:1;fill:none}
.da{stroke:#e5484d;stroke-width:1.4;fill:none;stroke-dasharray:3 5;animation:f 1.8s linear infinite}
.dl{stroke:#9aa3ad;stroke-width:1;fill:none;stroke-dasharray:2 4;animation:f 3s linear infinite}
.box{fill:#f4f6f8;stroke:#d8dde3;stroke-width:1} .boxa{fill:#f4f6f8;stroke:#e5484d;stroke-width:1.4}
.p{animation:p 2.2s ease-in-out infinite}
@keyframes f{to{stroke-dashoffset:-16}} @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<rect width="900" height="240" fill="#ffffff"/>
<text x="40" y="34" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">I work where large language models meet enterprise data.</text>
<text x="40" y="60" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">Most recently that meant natural-language access to SQL</text>
<text x="40" y="86" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">for business users: a RAG-grounded, multi-agent system</text>
<text x="40" y="112" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">that reads schemas and past queries, shipped on AWS.</text>
<text x="40" y="164" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">I care about the unglamorous half of AI: evaluation,</text>
<text x="40" y="190" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">determinism, and knowing whether a number from one</text>
<text x="40" y="216" class="fg s" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">model is comparable to a number from another.</text>
<text x="640" y="30" class="dim m" font-size="10" font-weight="400" letter-spacing="2" text-anchor="start">FOCUS</text>
<text x="640" y="49" class="fg m" font-size="11.5" font-weight="400" letter-spacing="0" text-anchor="start">agents · RAG · NL-to-SQL</text>
<text x="640" y="80" class="dim m" font-size="10" font-weight="400" letter-spacing="2" text-anchor="start">ALSO</text>
<text x="640" y="99" class="fg m" font-size="11.5" font-weight="400" letter-spacing="0" text-anchor="start">LLM evals · ML · dashboards</text>
<text x="640" y="130" class="dim m" font-size="10" font-weight="400" letter-spacing="2" text-anchor="start">CLOUD</text>
<text x="640" y="149" class="fg m" font-size="11.5" font-weight="400" letter-spacing="0" text-anchor="start">AWS · Azure OpenAI</text>
<text x="640" y="180" class="dim m" font-size="10" font-weight="400" letter-spacing="2" text-anchor="start">OPEN TO</text>
<text x="640" y="199" class="fg m" font-size="11.5" font-weight="400" letter-spacing="0" text-anchor="start">AI engineering roles</text>
<line x1="616" x2="616" y1="14" y2="214" class="ln"/>
</svg>
