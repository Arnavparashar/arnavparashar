<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="sysmap">
<style>
.fg{fill:#f0f3f6} .mut{fill:#9198a1} .dim{fill:#5c6570} .acc{fill:#ff5a5f}
.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.ln{stroke:#2a313b;stroke-width:1;fill:none} .lnf{stroke:#f0f3f6;stroke-width:1;fill:none}
.da{stroke:#ff5a5f;stroke-width:1.4;fill:none;stroke-dasharray:3 5;animation:f 1.8s linear infinite}
.dl{stroke:#5c6570;stroke-width:1;fill:none;stroke-dasharray:2 4;animation:f 3s linear infinite}
.box{fill:#151b23;stroke:#2a313b;stroke-width:1} .boxa{fill:#151b23;stroke:#ff5a5f;stroke-width:1.4}
.p{animation:p 2.2s ease-in-out infinite}
@keyframes f{to{stroke-dashoffset:-16}} @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<rect width="900" height="360" fill="#0d1117"/>
<text x="40" y="28" class="fg m" font-size="11" font-weight="400" letter-spacing="2.2" text-anchor="start">SYSTEM MAP — ONE PIPELINE, MANY PROJECTS</text>
<text x="860" y="28" class="mut m" font-size="11" font-weight="400" letter-spacing="2.2" text-anchor="end">FIG. 01</text>
<line x1="40" x2="860" y1="40" y2="40" class="lnf"/>
<path d="M230 85 C 290 85, 290 135, 345 135" class="dl"/>
<path d="M230 165 C 290 165, 290 135, 345 135" class="dl"/>
<path d="M230 245 C 290 245, 290 135, 345 135" class="dl"/>
<path d="M555 135 C 612 135, 612 81, 670 81" class="da"/>
<path d="M555 135 C 612 135, 612 147, 670 147" class="da"/>
<path d="M555 135 C 612 135, 612 213, 670 213" class="da"/>
<path d="M555 135 C 612 135, 612 279, 670 279" class="da"/>
<path d="M450 160 V 210" class="da"/>
