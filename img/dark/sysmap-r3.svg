<text x="52" y="98" class="mut m" font-size="10" font-weight="400" letter-spacing="0" text-anchor="start">csv · pdf · sql · sensors</text>
<rect x="40" y="140" width="190" height="50" rx="2" class="box"/>
<text x="52" y="161" class="fg m" font-size="11.5" font-weight="600" letter-spacing="0" text-anchor="start">PROMPTS</text>
<text x="52" y="178" class="mut m" font-size="10" font-weight="400" letter-spacing="0" text-anchor="start">personas · jobs · rubrics</text>
<rect x="40" y="220" width="190" height="50" rx="2" class="box"/>
<text x="52" y="241" class="fg m" font-size="11.5" font-weight="600" letter-spacing="0" text-anchor="start">SIGNALS</text>
<text x="52" y="258" class="mut m" font-size="10" font-weight="400" letter-spacing="0" text-anchor="start">alerts · prices · vitals</text>
