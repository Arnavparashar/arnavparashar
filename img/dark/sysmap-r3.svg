<text x="682" y="209" class="fg m" font-size="11.5" font-weight="600" letter-spacing="0" text-anchor="start">GUARDIAN</text>
<text x="682" y="226" class="mut m" font-size="10" font-weight="400" letter-spacing="0" text-anchor="start">AI-assisted SOC</text>
<rect x="670" y="254" width="190" height="50" rx="2" class="box"/>
<text x="682" y="275" class="fg m" font-size="11.5" font-weight="600" letter-spacing="0" text-anchor="start">DASHBOARDS</text>
