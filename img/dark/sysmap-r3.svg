<text x="40" y="344" class="mut m" font-size="10" font-weight="400" letter-spacing="2" text-anchor="start">SOLID — COMPONENT</text>
<text x="860" y="344" class="mut m" font-size="10" font-weight="400" letter-spacing="2" text-anchor="end">DASHED — DATA IN MOTION</text>
